<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>インターバルタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* レイアウト：上にバー、中央に大きなリング、下に操作ボタン。設定は全面パネル */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #23292f;
  --sub: #5c636b;
  --line: #dedbd3;
  --act: #f0761b;
  --act-soft: #fde4cf;
  --act-ink: #a94d06;
  --rest: #23a86a;
  --rest-soft: #d5f1e3;
  --rest-ink: #12703f;
  --neutral: #3a6cc0;
  --neutral-soft: #dde6f6;
  --font: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  --ring: min(72vw, 50dvh, 380px);
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: background-color .5s ease;
  --c: var(--act); --c-soft: var(--act-soft); --c-ink: var(--act-ink);
}
body.phase-act  { background: #fdf4ea; --c: var(--act);  --c-soft: var(--act-soft);  --c-ink: var(--act-ink); }
body.phase-rest { background: #ecf8f1; --c: var(--rest); --c-soft: var(--rest-soft); --c-ink: var(--rest-ink); }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
ruby rt { font-size: .5em; font-weight: 400; letter-spacing: 0; }
[hidden] { display: none !important; }

/* ───── 上のバー ───── */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
}
.top-btn {
  min-height: 48px; min-width: 48px; padding: 0 16px;
  display: inline-flex; align-items: center; gap: 8px;
  border: 2px solid var(--line); border-radius: 24px;
  background: var(--surface); font-size: 16px; font-weight: 700;
}
.top-btn:active { transform: scale(.96); }
.top-btn svg { flex-shrink: 0; }
.top-btn.off { color: var(--sub); }

/* ───── タイマー画面 ───── */
.screen {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(12px, 2.6dvh, 26px);
  padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px));
}
.phase-pill {
  font-size: 30px; font-weight: 700; color: #fff;
  background: var(--c); border-radius: 999px;
  padding: 10px 36px 8px; line-height: 1.5;
  transition: background-color .5s;
}
.phase-pill rt { color: #fff; }
.ring-wrap { position: relative; width: var(--ring); height: var(--ring); flex-shrink: 0; }
.ring-wrap svg { width: 100%; height: 100%; display: block; }
.ring-bg { stroke: var(--c-soft); transition: stroke .5s; }
.ring-prog { stroke: var(--c); stroke-linecap: round; transition: stroke .5s; }
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.ring-label { font-size: clamp(16px, calc(var(--ring) * .06), 22px); font-weight: 700; color: var(--sub); }
.time-disp {
  font-size: calc(var(--ring) * .3); font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.sets { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 90vw; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--c); background: transparent; }
.dot.done { background: var(--c); }
.dot.now { background: var(--c-soft); }
.set-text { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 14px; width: min(500px, 100%); }
.ctl-btn {
  flex: 1; min-height: 72px; border-radius: 20px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 22px; font-weight: 700;
}
.ctl-btn:active { transform: scale(.97); }
.btn-reset { background: var(--surface); border: 2px solid var(--line); }
.btn-toggle { background: var(--c); border: 2px solid var(--c); color: #fff; transition: background-color .5s, border-color .5s; }

/* 横向きで高さが少ないとき */
@media (orientation: landscape) and (max-height: 640px) {
  :root { --ring: min(66dvh, 42vw, 380px); }
  #screen-timer {
    display: grid; grid-template-columns: auto minmax(0, 420px);
    grid-template-areas: "ring pill" "ring sets" "ring ctl";
    align-content: center; justify-content: center; column-gap: 40px; row-gap: 16px;
  }
  #screen-timer .ring-wrap { grid-area: ring; }
  #screen-timer .phase-pill { grid-area: pill; justify-self: center; }
  #screen-timer .sets { grid-area: sets; }
  #screen-timer .controls { grid-area: ctl; width: 100%; }
}

/* ───── おわり画面 ───── */
.done-title { font-size: 40px; font-weight: 700; color: var(--act-ink); }
.done-text { font-size: 24px; font-weight: 700; }
.btn-again {
  min-height: 72px; width: min(340px, 100%); border-radius: 20px;
  background: var(--act); border: none; color: #fff; font-size: 22px; font-weight: 700;
}
.btn-again:active { transform: scale(.97); }

/* ───── 設定パネル ───── */
.modal {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(35, 41, 47, .45);
  display: flex; align-items: center; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
}
.sheet {
  width: min(720px, 100%); max-height: 100%;
  background: var(--bg); border-radius: 22px;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px 12px 22px; border-bottom: 2px solid var(--line); background: var(--surface);
}
.sheet-title { font-size: 20px; font-weight: 700; }
.btn-cancel {
  min-height: 48px; padding: 0 20px; border-radius: 24px;
  border: 2px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700;
}
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 6px; }
.sheet-foot { padding: 12px 16px; border-top: 2px solid var(--line); background: var(--surface); }
.btn-apply {
  width: 100%; min-height: 60px; border-radius: 18px; border: none;
  background: var(--neutral); color: #fff; font-size: 20px; font-weight: 700;
}
.btn-apply rt { color: #fff; }
.btn-apply:active { transform: scale(.98); }

.set-sec { --c: var(--neutral); --c-soft: var(--neutral-soft); --c-ink: var(--neutral); display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.set-sec.act  { --c: var(--act);  --c-soft: var(--act-soft);  --c-ink: var(--act-ink); }
.set-sec.rest { --c: var(--rest); --c-soft: var(--rest-soft); --c-ink: var(--rest-ink); }
.sec-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px; line-height: 1.6; }
.sec-tag { background: var(--c); color: #fff; border-radius: 10px; padding: 2px 12px 0; }
.sec-tag rt { color: #fff; }
.sub-title { font-size: 16px; font-weight: 700; color: var(--c-ink); margin: 8px 0 0 4px; line-height: 1.6; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
.row {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 16px; padding: 12px 16px;
}
.row + .row, .ev-list + .row, .row + .ev-list { border-top: 1px solid var(--line); }
.row.sub { background: #fbfaf8; }
.row-label { font-size: 16px; font-weight: 700; line-height: 1.6; }
.row-note { font-size: 14px; color: var(--sub); line-height: 1.6; }
.row-ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; }
.unit { font-size: 16px; font-weight: 700; color: var(--sub); line-height: 1.6; }
.note { font-size: 14px; color: var(--sub); padding: 0 16px 12px; line-height: 1.7; }

.stepper { display: inline-flex; align-items: center; gap: 4px; }
.st-btn {
  width: 48px; height: 48px; border-radius: 12px; border: none;
  background: var(--c-soft); color: var(--c-ink);
  font-size: 18px; font-weight: 700; touch-action: none;
}
.st-btn:active { background: var(--c); color: #fff; }
.st-input {
  width: 3.4em; height: 48px; border: 2px solid var(--line); border-radius: 10px;
  text-align: center; font-family: var(--font); font-size: 22px; font-weight: 700; color: var(--ink);
  background: var(--surface); font-variant-numeric: tabular-nums;
  user-select: text; -webkit-user-select: text;
}
.st-input:focus { border-color: var(--c); outline: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.chip {
  min-height: 44px; min-width: 52px; padding: 0 16px; border-radius: 22px;
  border: 2px solid var(--line); background: var(--surface);
  font-size: 16px; font-weight: 700; color: var(--ink);
}
.chip.active { background: var(--c); border-color: var(--c); color: #fff; }
.chip:active { transform: scale(.96); }

.switch-row {
  width: 100%; min-height: 48px; border: none; background: none; text-align: left;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.switch-row .sw-text { display: flex; flex-direction: column; gap: 2px; }
.switch-track { width: 60px; height: 34px; border-radius: 17px; background: #cfcbc4; position: relative; flex-shrink: 0; transition: background-color .2s; }
.switch-knob { position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch-row[aria-checked="true"] .switch-track { background: var(--c); }
.switch-row[aria-checked="true"] .switch-knob { transform: translateX(26px); }
.sw-state { font-size: 15px; font-weight: 700; color: var(--sub); min-width: 3em; text-align: right; }
.switch-row[aria-checked="true"] .sw-state { color: var(--c-ink); }
.sw-wrap { display: flex; align-items: center; gap: 10px; }

.ev-list { display: flex; flex-direction: column; }
.ev { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
.ev + .ev { border-top: 1px dashed var(--line); }
.ev-time { font-size: 17px; font-weight: 700; flex: 1; line-height: 1.6; }
.ev-snd { font-size: 15px; color: var(--sub); }
.ev-empty { padding: 10px 16px; font-size: 15px; color: var(--sub); }
.del-btn {
  min-height: 44px; min-width: 64px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 700; color: var(--sub);
}
.add-btn {
  min-height: 48px; padding: 0 20px; border-radius: 14px; border: none;
  background: var(--c); color: #fff; font-size: 17px; font-weight: 700;
}
.add-btn rt { color: #fff; }
.txt-input {
  height: 48px; width: 10em; max-width: 100%; padding: 0 12px;
  border: 2px solid var(--line); border-radius: 10px; background: var(--surface);
  font-family: var(--font); font-size: 18px; font-weight: 700; color: var(--ink);
  user-select: text; -webkit-user-select: text;
}
.txt-input.wide { width: 14em; }
.txt-input:focus { border-color: var(--c); outline: none; }
.try-btn {
  min-height: 48px; padding: 0 16px; border-radius: 14px;
  border: 2px solid var(--c); background: var(--surface); color: var(--c-ink); font-size: 16px; font-weight: 700;
}
.ev-list.sub { background: #fbfaf8; }
.add-msg.sub { background: #fbfaf8; }
.set-sec .card + .card { margin-top: 2px; }
.add-msg { font-size: 15px; font-weight: 700; color: var(--c-ink); min-height: 1.6em; padding: 0 16px 10px; text-align: right; }
.hint { font-size: 14px; color: var(--sub); line-height: 1.8; padding: 16px 4px 0; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body class="phase-act">

<header class="topbar">
  <button type="button" class="top-btn" id="btn-settings" aria-label="設定">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    <span><ruby>設定<rt>せってい</rt></ruby></span>
  </button>
  <button type="button" class="top-btn" id="btn-volume">
    <svg id="vol-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
    <span id="vol-label"></span>
  </button>
</header>

<main class="screen" id="screen-timer">
  <div class="phase-pill" id="phase-pill"></div>
  <div class="ring-wrap">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle class="ring-bg" cx="150" cy="150" r="135" fill="none" stroke-width="18"/>
      <circle class="ring-prog" id="ring-prog" cx="150" cy="150" r="135" fill="none" stroke-width="18"
        stroke-dasharray="848.23" stroke-dashoffset="0" transform="rotate(-90 150 150)"/>
    </svg>
    <div class="ring-center">
      <div class="ring-label">のこり</div>
      <div class="time-disp" id="time-disp">30</div>
    </div>
  </div>
  <div class="sets">
    <div class="dots" id="set-dots"></div>
    <div class="set-text" id="set-text"></div>
  </div>
  <div class="controls">
    <button type="button" class="ctl-btn btn-reset" id="btn-reset">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      はじめから
    </button>
    <button type="button" class="ctl-btn btn-toggle" id="btn-toggle">
      <svg id="toggle-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"></svg>
      <span id="toggle-text">スタート</span>
    </button>
  </div>
</main>

<main class="screen" id="screen-done" hidden>
  <svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#f0761b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
  <div class="done-title">おつかれさま！</div>
  <div class="done-text" id="done-text"></div>
  <button type="button" class="btn-again" id="btn-again">もういちど</button>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="sheet-title">タイマーの<ruby>設定<rt>せってい</rt></ruby></div>
      <button type="button" class="btn-cancel" id="btn-cancel">やめる</button>
    </div>
    <div class="sheet-body" id="settings-body"></div>
    <div class="sheet-foot">
      <button type="button" class="btn-apply" id="btn-apply">これで<ruby>決<rt>き</rt></ruby>める</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────
// 基本
// ─────────────────────────────────────────
const $ = s => document.querySelector(s);
const R = (k, y) => `<ruby>${k}<rt>${y}</rt></ruby>`;
const totalSec = o => o.min * 60 + o.sec;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function clampInt(v, a, b, d) { v = parseInt(v, 10); return isNaN(v) ? d : clamp(v, a, b); }
const CIRC = 2 * Math.PI * 135;

const SOUND_LABEL = { pip: 'ピッ', bell: 'ベル', chime: 'チャイム', melody: 'メロディー', switch: 'ポーン' };
const SOUND_IDS = ['pip', 'bell', 'chime', 'melody'];
const END_IDS   = ['switch', 'bell', 'chime', 'melody'];
const CD_IDS    = ['pip', 'bell', 'chime'];
const CD_LENS   = [3, 5, 10, 30];

function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : String(s);
}
function fmtDur(o) {
  if (o.min > 0) return `${o.min}分${o.sec > 0 ? o.sec + '秒' : ''}`;
  return `${o.sec}秒`;
}

// ─────────────────────────────────────────
// 設定の初期値と保存
// ─────────────────────────────────────────
const DEFAULT_NAME   = { act: 'かつどう', rest: 'おやすみ' };
const DEFAULT_SPEECH = { act: 'かつどう', rest: 'おやすみ' };
// 前の版の初期値で保存されていたら、新しい初期値にそろえる
const OLD_NAMES   = ['活動', '休憩', 'きゅうけい'];
const OLD_SPEECHS = ['かつどうだよ', 'きゅうけいだよ', 'きゅうけい'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function phaseDefault(P) {
  return { name: DEFAULT_NAME[P], speech: DEFAULT_SPEECH[P],
           dur: { min: 0, sec: 30 }, ivOn: false, iv: { min: 0, sec: 30 }, ivSound: 'pip',
           beforeOn: false, before: [], cdOn: false, cdLen: 3, cdSound: 'pip', ringback: false, endSound: 'switch' };
}
function defaultSettings() { return { cycles: 3, speakOn: false, ph: { act: phaseDefault('act'), rest: phaseDefault('rest') } }; }

function cleanText(v, max, def) {
  v = typeof v === 'string' ? v.trim().slice(0, max) : '';
  return v || def;
}
function sanitizePhase(p, d) {
  p = p || {};
  const mm = (o, dd, maxMin) => ({ min: clampInt(o && o.min, 0, maxMin, dd.min), sec: clampInt(o && o.sec, 0, 59, dd.sec) });
  const r = {
    name: OLD_NAMES.includes(p.name) ? d.name : cleanText(p.name, 12, d.name),
    speech: OLD_SPEECHS.includes(p.speech) ? d.speech : cleanText(p.speech, 40, d.speech),
    beforeOn: !!p.beforeOn,
    cdOn: !!p.cdOn,
    dur: mm(p.dur, d.dur, 180),
    ivOn: !!p.ivOn,
    iv: mm(p.iv, d.iv, 60),
    ivSound: SOUND_IDS.includes(p.ivSound) ? p.ivSound : d.ivSound,
    before: Array.isArray(p.before) ? p.before.map(e => ({
      min: clampInt(e && e.min, 0, 60, 0), sec: clampInt(e && e.sec, 0, 59, 10),
      sound: SOUND_IDS.includes(e && e.sound) ? e.sound : 'pip' })).filter(e => totalSec(e) > 0) : [],
    cdLen: CD_LENS.includes(p.cdLen) ? p.cdLen : d.cdLen,
    cdSound: CD_IDS.includes(p.cdSound) ? p.cdSound : d.cdSound,
    ringback: !!p.ringback,
    endSound: END_IDS.includes(p.endSound) ? p.endSound : d.endSound,
  };
  if (totalSec(r.dur) < 1) r.dur = { min: 0, sec: 1 };
  r.before.sort((a, b) => totalSec(b) - totalSec(a));
  return r;
}
function sanitizeSettings(s) {
  s = s || {};
  const d = defaultSettings();
  return {
    cycles: s.cycles === null ? null : clampInt(s.cycles, 1, 99, d.cycles),
    speakOn: !!s.speakOn,
    ph: { act: sanitizePhase(s.ph && s.ph.act, d.ph.act), rest: sanitizePhase(s.ph && s.ph.rest, d.ph.rest) },
  };
}
const STORE_KEY = 'interval-timer-v3';
function loadSaved() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveAll() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ muted: state.muted, settings: state.settings })); }
  catch (e) { /* 保存できない環境でもそのまま動かす */ }
}

// ─────────────────────────────────────────
// 音
// ─────────────────────────────────────────
let actx = null;
function getACtx() {
  try {
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      actx = new C();
    }
    if (actx.state !== 'running') actx.resume();
  } catch (e) { return null; }
  return actx;
}
// タップの中で最初に呼んで、iPadの音を使えるようにする
function unlockAudio() {
  unlockSpeech();
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const ctx = getACtx();
  if (!ctx) return;
  try {
    const b = ctx.createBuffer(1, 1, 22050);
    const s = ctx.createBufferSource();
    s.buffer = b; s.connect(ctx.destination); s.start(0);
  } catch (e) {}
}

// ── 読み上げ ──
let jaVoice = null, speechUnlocked = false;
const hasSpeech = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function loadVoices() {
  try {
    const vs = speechSynthesis.getVoices();
    jaVoice = vs.find(v => v.lang === 'ja-JP') || vs.find(v => /^ja/i.test(v.lang)) || jaVoice;
  } catch (e) {}
}
if (hasSpeech) {
  loadVoices();
  try {
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', loadVoices);
    else speechSynthesis.onvoiceschanged = loadVoices;
  } catch (e) {}
}
// タップの中で一度だけ、無音の発話で読み上げを使えるようにする
function unlockSpeech() {
  if (!hasSpeech || speechUnlocked) return;
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    speechSynthesis.speak(u);
    speechUnlocked = true;
  } catch (e) {}
}
function speak(text, force) {
  if (!hasSpeech || !text) return;
  if (state.muted && !force) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    if (!jaVoice) loadVoices();
    if (jaVoice) u.voice = jaVoice;
    u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}
let speakTimer = null;
function speakPhase(delay) {
  if (!state.settings.speakOn) return;
  const text = phaseCfg().speech;
  if (speakTimer) clearTimeout(speakTimer);
  if (delay) speakTimer = setTimeout(() => speak(text), delay);
  else speak(text);
}

function playSound(type, force) {
  if (state.muted && !force) return;
  const ctx = getACtx();
  if (!ctx) return;
  const now = ctx.currentTime + 0.02;
  const tone = (freq, gain, start, dur, wave = 'sine') => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = wave; o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(gain, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.start(start); o.stop(start + dur + 0.05);
  };

  switch (type) {
    case 'pip': tone(880, 0.12, now, 0.12, 'square'); break;
    case 'bell':
      tone(523.25, 0.14, now, 1.0); tone(1046.5, 0.07, now, 0.8); tone(1318.5, 0.05, now, 0.6); break;
    case 'chime':
      [[392, .10], [523.25, .10], [659.25, .08], [783.99, .06]].forEach(([f, g], i) => tone(f, g, now + i * 0.14, 1.4));
      break;
    case 'melody': {
      // ちゃらら・ららら・ららりらーん
      const seq = [[523.25, .16], [659.25, .16], [783.99, .26], [0, .08],
                   [587.33, .16], [698.46, .16], [880, .26], [0, .08],
                   [783.99, .16], [880, .16], [987.77, .16], [1046.5, 0]];
      let t = now;
      seq.forEach(([f, d], i) => {
        if (f) {
          const last = i === seq.length - 1;
          tone(f, 0.11, t, last ? 1.9 : d * 1.6, 'triangle');
          tone(f * 2, 0.03, t, last ? 1.2 : d, 'sine');
          if (last) { tone(659.25, 0.05, t, 1.9); tone(783.99, 0.05, t, 1.9); }
        }
        t += d;
      });
      break;
    }
    case 'switch': tone(523.25, 0.14, now, 0.7); tone(659.25, 0.10, now + 0.08, 0.6); break;
    case 'cd_pip': tone(660, 0.10, now, 0.10, 'square'); break;
    case 'cd_bell': tone(880, 0.12, now, 0.4); tone(1760, 0.06, now, 0.3); break;
    case 'cd_chime': tone(523.25, 0.10, now, 0.5); tone(659.25, 0.08, now + 0.05, 0.45); break;
    case 'ringback': {
      const notes = [392, 440, 392, 330, 262, 294, 262];
      const durs = [.25, .25, .25, .5, .25, .25, .5];
      let t = now;
      for (let r = 0; r < 2; r++) {
        notes.forEach((f, i) => { tone(f, 0.13, t, durs[i] * 0.9, 'square'); t += durs[i]; });
        t += 0.3;
      }
      break;
    }
    case 'fanfare':
      [[523.25, 0], [659.25, .12], [783.99, .24], [1046.5, .36]].forEach(([f, d]) => tone(f, 0.12, now + d, 1.2));
      break;
  }
}

// ─────────────────────────────────────────
// タイマー(requestAnimationFrame + 経過時間)
// ─────────────────────────────────────────
const state = {
  muted: false,
  settings: defaultSettings(),
  phase: 'act',
  elapsedMs: 0,
  lastWhole: 0,
  isActive: false,
  isStarted: false,
  isCompleted: false,
  completed: 0,
  fired: new Set(),
  ringStarted: false,
};
const phaseCfg = () => state.settings.ph[state.phase];
const phaseDurSec = () => totalSec(phaseCfg().dur);

let rafId = null, lastTs = null;
function frame(ts) {
  rafId = null;
  if (!state.isActive) return;
  if (lastTs === null) lastTs = ts;
  let dt = ts - lastTs; lastTs = ts;
  if (dt < 0) dt = 0;
  // 画面が裏に回っていたあとの大きなずれは、音を鳴らさずに追いつく
  advance(dt, dt > 1500);
  if (state.isCompleted) { renderAll(); return; }
  renderClock();
  rafId = requestAnimationFrame(frame);
}

function advance(dt, silent) {
  state.elapsedMs += dt;
  let guard = 0;
  while (state.isActive && guard++ < 1000) {
    const durSec = phaseDurSec(), durMs = durSec * 1000;
    const whole = Math.min(Math.floor(state.elapsedMs / 1000), durSec);
    while (state.lastWhole < whole) {
      state.lastWhole++;
      if (state.lastWhole < durSec) onSecond(state.lastWhole, durSec, silent);
    }
    if (state.elapsedMs >= durMs) { state.elapsedMs -= durMs; endPhase(silent); continue; }
    break;
  }
}

function onSecond(s, durSec, silent) {
  if (silent) return;
  const cfg = phaseCfg();
  const left = durSec - s;
  if (cfg.cdOn) {
    if (cfg.ringback) {
      if (left === cfg.cdLen && !state.ringStarted) { state.ringStarted = true; playSound('ringback'); }
    } else if (left <= cfg.cdLen) {
      playSound('cd_' + cfg.cdSound);
    }
  }
  if (cfg.ivOn) {
    const iv = totalSec(cfg.iv);
    if (iv > 0 && s % iv === 0) playSound(cfg.ivSound);
  }
  if (cfg.beforeOn) cfg.before.forEach(ev => {
    const k = totalSec(ev);
    if (left === k && !state.fired.has(k)) { state.fired.add(k); playSound(ev.sound); }
  });
}

function endPhase(silent) {
  const cycles = state.settings.cycles;
  if (state.phase === 'act') {
    state.completed++;
    if (cycles !== null && state.completed >= cycles) { finish(); return; }
    if (!silent) playSound(phaseCfg().endSound);
    state.phase = 'rest';
  } else {
    if (!silent) playSound(phaseCfg().endSound);
    state.phase = 'act';
  }
  state.lastWhole = 0;
  state.fired = new Set();
  state.ringStarted = false;
  if (!silent) speakPhase(700);
  renderPhase();
  renderSets();
}

function finish() {
  state.isActive = false;
  state.isCompleted = true;
  state.elapsedMs = 0;
  playSound('fanfare');
  releaseWakeLock();
}

function startTimer() {
  if (!state.isStarted) speakPhase(0); // はじめのスタートでも読み上げる
  state.isActive = true; state.isStarted = true;
  lastTs = null;
  if (!rafId) rafId = requestAnimationFrame(frame);
  requestWakeLock();
}
function pauseTimer() {
  state.isActive = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  releaseWakeLock();
}
function toggleTimer() {
  unlockAudio(); // いちばん最初に呼ぶ
  if (state.isCompleted) return;
  if (state.isActive) pauseTimer(); else startTimer();
  renderAll();
}
function resetTimer() {
  pauseTimer();
  if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
  try { if (hasSpeech) speechSynthesis.cancel(); } catch (e) {}
  state.isStarted = false;
  state.isCompleted = false;
  state.completed = 0;
  state.phase = 'act';
  state.elapsedMs = 0;
  state.lastWhole = 0;
  state.fired = new Set();
  state.ringStarted = false;
  lastShown = null;
  renderAll();
}

// 画面が暗くならないようにする(使えない端末ではそのまま)
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.isActive) requestWakeLock();
});

// ─────────────────────────────────────────
// 表示
// ─────────────────────────────────────────
const timeEl = $('#time-disp'), ringEl = $('#ring-prog');
let lastShown = null;

function renderClock() {
  const durMs = phaseDurSec() * 1000;
  const remMs = Math.max(0, durMs - state.elapsedMs);
  const remSec = Math.ceil(remMs / 1000);
  if (remSec !== lastShown) { lastShown = remSec; timeEl.textContent = fmtTime(remSec); }
  const frac = durMs > 0 ? remMs / durMs : 1;
  ringEl.style.strokeDashoffset = CIRC * (1 - frac);
}

function renderPhase() {
  const isAct = state.phase === 'act' || state.isCompleted;
  document.body.className = isAct ? 'phase-act' : 'phase-rest';
  $('#phase-pill').innerHTML = nameHTML(isAct ? 'act' : 'rest', state.settings);
  lastShown = null;
}

function nameHTML(P, settings) {
  return esc(settings.ph[P].name || DEFAULT_NAME[P]);
}

function renderSets() {
  const C = state.settings.cycles;
  let cur = state.completed + (state.phase === 'act' ? 1 : 0);
  if (cur < 1) cur = 1;
  if (C !== null) cur = Math.min(cur, C);
  const dots = $('#set-dots');
  if (C !== null && C <= 12) {
    let h = '';
    for (let i = 0; i < C; i++) {
      const cls = i < state.completed ? 'done' : (i === cur - 1 ? 'now' : '');
      h += `<span class="dot ${cls}"></span>`;
    }
    dots.innerHTML = h; dots.hidden = false;
  } else {
    dots.innerHTML = ''; dots.hidden = true;
  }
  $('#set-text').textContent = C !== null ? `${cur} / ${C} セットめ` : `${cur} セットめ`;
}

const ICON_PLAY  = '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>';
const ICON_PAUSE = '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>';
const ICON_VOL   = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
const ICON_MUTE  = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>';

function renderAll() {
  $('#screen-timer').hidden = state.isCompleted;
  $('#screen-done').hidden = !state.isCompleted;
  renderPhase();
  if (state.isCompleted) {
    $('#done-text').textContent = `${state.completed}セット できたよ`;
  } else {
    renderClock();
    renderSets();
  }
  $('#toggle-icon').innerHTML = state.isActive ? ICON_PAUSE : ICON_PLAY;
  $('#toggle-text').textContent = state.isActive ? 'とめる' : (state.isStarted ? 'つづける' : 'スタート');
  $('#vol-icon').innerHTML = state.muted ? ICON_MUTE : ICON_VOL;
  $('#vol-label').innerHTML = state.muted ? `${R('音', 'おと')}なし` : `${R('音', 'おと')}あり`;
  $('#btn-volume').classList.toggle('off', state.muted);
  $('#btn-volume').setAttribute('aria-label', state.muted ? '音なし' : '音あり');
}

function regFields() {
  FIELDS = {};
  FIELDS.cycles = { get: () => wk.cycles, set: v => { wk.cycles = v; }, min: 1, max: 99, nullable: true };
  ['act', 'rest'].forEach(P => {
    const p = wk.ph[P], b = wkBf[P];
    const fix = () => { if (totalSec(p.dur) < 1) p.dur.sec = 1; };
    FIELDS[P + '-min']   = { get: () => p.dur.min, set: v => { p.dur.min = v; fix(); }, min: 0, max: 180 };
    FIELDS[P + '-sec']   = { get: () => p.dur.sec, set: v => { p.dur.sec = v; fix(); }, min: 0, max: 59 };
    FIELDS[P + '-ivmin'] = { get: () => p.iv.min,  set: v => { p.iv.min = v; },  min: 0, max: 60 };
    FIELDS[P + '-ivsec'] = { get: () => p.iv.sec,  set: v => { p.iv.sec = v; },  min: 0, max: 59 };
    FIELDS[P + '-bfmin'] = { get: () => b.min,     set: v => { b.min = v; },     min: 0, max: 60 };
    FIELDS[P + '-bfsec'] = { get: () => b.sec,     set: v => { b.sec = v; },     min: 0, max: 59 };
  });
}

function splitGroup(g) {
  const i = g.indexOf('-');
  return i < 0 ? [null, g] : [g.slice(0, i), g.slice(i + 1)];
}
function chipValue(group) {
  if (group === 'cycles') return wk.cycles === null ? 'none' : String(wk.cycles);
  const [P, k] = splitGroup(group), p = wk.ph[P];
  switch (k) {
    case 'preset':   return `${p.dur.min}:${p.dur.sec}`;
    case 'end':      return p.endSound;
    case 'iv-sound': return p.ivSound;
    case 'bf-sound': return wkBf[P].sound;
    case 'cd-len':   return String(p.cdLen);
    case 'cd-sound': return p.cdSound;
  }
  return '';
}
function onChip(group, value) {
  if (group === 'cycles') { wk.cycles = value === 'none' ? null : parseInt(value, 10); return; }
  const [P, k] = splitGroup(group), p = wk.ph[P];
  switch (k) {
    case 'preset': { const [m, s] = value.split(':').map(Number); p.dur = { min: m, sec: s }; break; }
    case 'end':      p.endSound = value; playSound(value, true); break;
    case 'iv-sound': p.ivSound = value; playSound(value, true); break;
    case 'bf-sound': wkBf[P].sound = value; playSound(value, true); break;
    case 'cd-len':   p.cdLen = parseInt(value, 10); break;
    case 'cd-sound': p.cdSound = value; playSound('cd_' + value, true); break;
  }
}
const TOGGLE_KEY = { iv: 'ivOn', bf: 'beforeOn', cd: 'cdOn', ring: 'ringback' };
function toggleVal(id) {
  if (id === 'speak') return wk.speakOn;
  const [P, k] = splitGroup(id);
  return !!wk.ph[P][TOGGLE_KEY[k]];
}
function flipToggle(id) {
  if (id === 'speak') { wk.speakOn = !wk.speakOn; return; }
  const [P, k] = splitGroup(id);
  wk.ph[P][TOGGLE_KEY[k]] = !wk.ph[P][TOGGLE_KEY[k]];
}

function renderEvList(P) {
  const list = wk.ph[P].before;
  const el = document.getElementById(P + '-list');
  if (!list.length) { el.innerHTML = '<div class="ev-empty">まだありません</div>'; return; }
  el.innerHTML = list.map((ev, i) => `<div class="ev">
      <span class="ev-time">のこり ${fmtDur(ev)}${R('前', 'まえ')}</span>
      <span class="ev-snd">${SOUND_LABEL[ev.sound]}</span>
      <button type="button" class="del-btn" data-del="${P}" data-i="${i}">けす</button>
    </div>`).join('');
}

function syncSettings() {
  for (const id in FIELDS) {
    const inp = document.getElementById(id);
    if (!inp || document.activeElement === inp) continue;
    const v = FIELDS[id].get();
    inp.value = v === null ? '' : String(v);
    if (id === 'cycles') inp.placeholder = 'なし';
  }
  document.querySelectorAll('#settings-body .chip').forEach(c =>
    c.classList.toggle('active', chipValue(c.dataset.group) === c.dataset.value));
  document.querySelectorAll('#settings-body [data-toggle]').forEach(b => {
    const on = toggleVal(b.dataset.toggle);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    const st = b.querySelector('[data-swstate]');
    if (st) st.textContent = on ? 'オン' : 'オフ';
  });
  document.querySelectorAll('#settings-body [data-show], #settings-body [data-hideon]').forEach(el => {
    const show = (!el.dataset.show || toggleVal(el.dataset.show)) && (!el.dataset.hideon || !toggleVal(el.dataset.hideon));
    el.hidden = !show;
  });
  renderEvList('act'); renderEvList('rest');
}

function openSettings() {
  unlockAudio();
  wk = JSON.parse(JSON.stringify(state.settings));
  wkBf = { act: { min: 0, sec: 10, sound: 'pip' }, rest: { min: 0, sec: 10, sound: 'pip' } };
  buildSettings();
  regFields();
  syncSettings();
  $('#modal').hidden = false;
  $('#settings-body').scrollTop = 0;
}
function closeSettings() { stopRepeat(); $('#modal').hidden = true; }
function applySettings() {
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('st-input')) commitInput(ae);
  if (ae && ae.blur) ae.blur();
  state.settings = sanitizeSettings(wk);
  saveAll();
  closeSettings();
  renderAll();
}

// ── ▽△ボタン(長押しで連続) ──
function doStep(id, dir) {
  const f = FIELDS[id];
  if (!f) return;
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('st-input')) ae.blur();
  const cur = f.get();
  const v = cur === null ? f.min : clamp(cur + dir, f.min, f.max);
  f.set(v);
  syncSettings();
}
let repTimer = null;
function startRepeat(id, dir) {
  stopRepeat();
  doStep(id, dir);
  let count = 0;
  const run = () => {
    count++;
    doStep(id, dir);
    // 長くおすほど速くなる
    const next = count < 5 ? 160 : count < 15 ? 90 : 45;
    repTimer = setTimeout(run, next);
  };
  repTimer = setTimeout(run, 450);
}
function stopRepeat() { if (repTimer) { clearTimeout(repTimer); repTimer = null; } }

// ── 直接入力 ──
function commitInput(inp) {
  const f = FIELDS[inp.id];
  if (!f) return;
  const raw = inp.value
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[^0-9]/g, '');
  if (raw !== '') f.set(clamp(parseInt(raw, 10), f.min, f.max));
  inp.blur();
  syncSettings();
}

// ─────────────────────────────────────────
// 操作
// ─────────────────────────────────────────
const body = $('#settings-body');

body.addEventListener('pointerdown', e => {
  const b = e.target.closest('.st-btn');
  if (!b) return;
  e.preventDefault();
  unlockAudio();
  startRepeat(b.dataset.for, parseInt(b.dataset.step, 10));
});
window.addEventListener('pointerup', stopRepeat);
window.addEventListener('pointercancel', stopRepeat);
body.addEventListener('pointerout', e => { if (e.target.closest('.st-btn')) stopRepeat(); });

body.addEventListener('click', e => {
  const st = e.target.closest('.st-btn');
  if (st) { if (e.detail === 0) doStep(st.dataset.for, parseInt(st.dataset.step, 10)); return; } // キーボード操作用
  const chip = e.target.closest('.chip');
  if (chip) { unlockAudio(); onChip(chip.dataset.group, chip.dataset.value); syncSettings(); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { flipToggle(tg.dataset.toggle); syncSettings(); return; }
  const add = e.target.closest('[data-add]');
  if (add) {
    const P = add.dataset.add, b = wkBf[P], list = wk.ph[P].before;
    const msg = document.getElementById(P + '-addmsg');
    const k = totalSec(b);
    if (k <= 0) { msg.innerHTML = `0秒より${R('大', 'おお')}きくしてね`; return; }
    const same = list.find(ev => totalSec(ev) === k);
    if (same) { same.sound = b.sound; msg.innerHTML = `のこり${fmtDur(b)}${R('前', 'まえ')}の${R('音', 'おと')}をかえたよ`; }
    else {
      list.push({ min: b.min, sec: b.sec, sound: b.sound });
      list.sort((x, y) => totalSec(y) - totalSec(x));
      msg.innerHTML = `のこり${fmtDur(b)}${R('前', 'まえ')}を${R('追加', 'ついか')}したよ`;
    }
    syncSettings();
    return;
  }
  const tr = e.target.closest('[data-try]');
  if (tr) {
    unlockAudio();
    const P = tr.dataset.try;
    speak(cleanText(wk.ph[P].speech, 40, DEFAULT_SPEECH[P]), true);
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    wk.ph[del.dataset.del].before.splice(parseInt(del.dataset.i, 10), 1);
    document.getElementById(del.dataset.del + '-addmsg').textContent = '';
    syncSettings();
  }
});
body.addEventListener('change', e => { if (e.target.classList.contains('st-input')) commitInput(e.target); });
// 名前・読み上げことば
body.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.text) return;
  const P = t.dataset.ph;
  wk.ph[P][t.dataset.text] = t.value;
  if (t.dataset.text === 'name') {
    document.getElementById(P + '-tag').textContent = t.value.trim() || DEFAULT_NAME[P];
  }
});
body.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('st-input')) { e.preventDefault(); commitInput(e.target); }
  else if (e.key === 'Enter' && e.target.classList.contains('txt-input')) { e.preventDefault(); e.target.blur(); }
});
body.addEventListener('focusin', e => {
  if (e.target.classList.contains('st-input')) setTimeout(() => { try { e.target.select(); } catch (err) {} }, 0);
});

$('#btn-settings').addEventListener('click', openSettings);
$('#btn-cancel').addEventListener('click', closeSettings);
$('#btn-apply').addEventListener('click', applySettings);
$('#btn-toggle').addEventListener('click', toggleTimer);
$('#btn-reset').addEventListener('click', () => { unlockAudio(); resetTimer(); });
$('#btn-again').addEventListener('click', () => { unlockAudio(); resetTimer(); });
$('#btn-volume').addEventListener('click', () => {
  unlockAudio();
  state.muted = !state.muted;
  saveAll();
  renderAll();
});

// 長押しメニュー・ダブルタップ拡大をおさえる
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
document.addEventListener('gesturestart', e => e.preventDefault());

// ─────────────────────────────────────────
// はじめに
// ─────────────────────────────────────────
(function init() {
  const saved = loadSaved();
  if (saved) {
    state.muted = !!saved.muted;
    state.settings = sanitizeSettings(saved.settings);
  }
  resetTimer();
})();
</script>
</body>
